<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Zemer Search</title><style>

g-left:12px;padding-right:12px}.search button{padding:0 18px}.row{padding:10px 4px}.art{width:52px;height:52px}}</style></head><body><div class="wrap"><header><div class="logo">Zemer</div></header><form class="search" id="form"><input id="q" autocomplete="off" placeholder="Search songs, artists, albums…" autofocus><button>Search</button></form><div id="status">Search songs, artists, albums…</div><main id="results"></main></div><div class="player" id="player" hidden><div class="progress"><i id="bar"></i></div><div class="playerin"><img class="art" id="part" src="" alt=""><div class="ptext"><div class="title" id="ptitle"></div><div class="sub" id="psub"></div></div><div class="pcontrols"><button id="pause">▶</button></div></div></div><div id="yt" class="yt"></div><script src="https://www.youtube.com/iframe_api"></script><script src="./app.js?v=4"></script></body></html>
