<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><title>Zemer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#171717}
body{padding:0 16px 94px}.wrap{width:min(920px,100%);margin:auto}header{display:flex;align-items:center;justify-content:center;padding:24px 0 16px}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px}.search{display:flex;gap:9px;max-width:760px;margin:8px auto 26px}.search input{flex:1;height:52px;border:1px solid #d6d6d6;border-radius:27px;padding:0 19px;font-size:17px;outline:0;background:#fafafa}.search input:focus{border-color:#888;background:#fff}.search button{height:52px;border:0;border-radius:27px;padding:0 22px;background:#111;color:#fff;font-size:16px;font-weight:700}
#status{text-align:center;color:#777;margin:22px 0}.section{margin:27px 0}.section h2{font-size:19px;margin:0 0 10px}.row{display:flex;align-items:center;gap:13px;padding:10px 7px;border-radius:12px;cursor:pointer}.row:hover{background:#f5f5f5}.art{width:58px;height:58px;border-radius:9px;object-fit:cover;background:#eee;flex:none}.info{min-width:0;flex:1}.title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:14px;color:#777;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action{border:0;background:#eee;width:40px;height:40px;border-radius:50%;font-size:17px;flex:none}.albumHero{display:flex;gap:18px;align-items:center;padding:8px 2px 22px}.heroArt{width:150px;height:150px;border-radius:12px;object-fit:cover;background:#eee}.heroTitle{font-size:28px;font-weight:800;line-height:1.08}.heroSub{color:#777;margin-top:8px}.back{border:0;background:#f1f1f1;border-radius:20px;padding:9px 15px;font-weight:650;margin-bottom:14px}.tracknum{width:28px;color:#999;text-align:center}.player{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 18px #00000012}.playerin{width:min(920px,100%);margin:auto;display:flex;align-items:center;gap:11px}.miniArt{width:48px;height:48px;border-radius:7px;object-fit:cover;background:#eee}.ptext{min-width:0;flex:1}.pcontrols{display:flex;gap:7px}.pcontrols button{border:0;background:#111;color:#fff;border-radius:50%;width:40px;height:40px}.progress{position:absolute;left:0;right:0;top:-2px;height:3px;background:#ddd}.progress i{display:block;width:0;height:100%;background:#111}.full{position:fixed;inset:0;background:#fff;z-index:30;display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow:auto}.full.open{display:flex}.fullTop{display:flex;justify-content:space-between;align-items:center}.iconbtn{border:0;background:#f1f1f1;border-radius:50%;width:42px;height:42px;font-size:20px}.fullArt{width:min(78vw,380px);aspect-ratio:1;margin:45px auto 28px;border-radius:18px;object-fit:cover;background:#eee}.fullInfo{text-align:center}.fullTitle{font-size:25px;font-weight:800}.fullArtist{color:#777;margin-top:6px}.seek{width:100%;margin-top:25px}.times{display:flex;justify-content:space-between;color:#777;font-size:12px}.range{width:100%;accent-color:#111}.bigControls{display:flex;justify-content:center;align-items:center;gap:22px;margin:25px 0}.bigControls button{border:0;background:#f0f0f0;border-radius:50%;width:50px;height:50px;font-size:20px}.bigControls .main{background:#111;color:#fff;width:66px;height:66px;font-size:25px}.queue{border-top:1px solid #eee;padding-top:18px}.queue h3{margin:0 0 10px}.qrow{display:flex;gap:10px;align-items:center;padding:9px 0}.qrow img{width:44px;height:44px;border-radius:6px;object-fit:cover}.qinfo{min-width:0}.qtitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qsub{font-size:13px;color:#777}.yt{position:fixed;width:1px;height:1px;left:-10px;top:-10px;opacity:.01;pointer-events:none}
@media(max-width:600px){body{padding-left:10px;padding-right:10px}.search button{padding:0 18px}.heroArt{width:118px;height:118px}.heroTitle{font-size:24px}.row{padding:9px 3px}}
</style></head><body>
<div class="wrap"><header><div class="logo">Zemer</div></header>
<form class="search" id="form"><input id="q" autocomplete="off" placeholder="Search songs, artists, albums…" autofocus><button>Search</button></form>
<div id="status">Search songs, artists, albums…</div><main id="results"></main></div>
<div class="player" id="player" hidden><div class="progress"><i id="bar"></i></div><div class="playerin"><img class="miniArt" id="part"><div class="ptext"><div class="title" id="ptitle"></div><div class="sub" id="psub"></div></div><div class="pcontrols"><button id="prev">‹</button><button id="pause">▶</button><button id="next">›</button></div></div></div>
<div class="full" id="full"><div class="fullTop"><button class="iconbtn" id="closeFull">⌄</button><span>Now Playing</span><button class="iconbtn" id="openQueue">☰</button></div><img class="fullArt" id="fart"><div class="fullInfo"><div class="fullTitle" id="ftitle"></div><div class="fullArtist" id="fartist"></div></div><div class="seek"><input class="range" id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div><div class="bigControls"><button id="fprev">⏮</button><button class="main" id="fpause">▶</button><button id="fnext">⏭</button></div><div class="queue"><h3>Up Next</h3><div id="queue"></div></div></div>
<audio id="audio" preload="metadata"></audio><script src="https://lambakj3-source.github.io/zemer-app-ios/app.js?v=10"></script>
</body></html>
