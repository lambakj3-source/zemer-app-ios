<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="description" content="Zemer — a simple music player for the web.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Zemer</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Zemer</div>
      <button id="searchButton" class="icon-button" aria-label="Search">⌕</button>
    </header>

    <main id="main">
      <section id="homeView" class="view active">
        <div class="hero">
          <p class="eyebrow">MUSIC</p>
          <h1>What do you want to hear?</h1>
          <form id="searchForm" class="search-box">
            <input id="searchInput" autocomplete="off" placeholder="Songs, artists, albums" aria-label="Search music">
            <button type="submit">Search</button>
          </form>
        </div>
        <div id="results" class="results"></div>
      </section>

      <section id="libraryView" class="view">
        <div class="section-heading">
          <div>
            <p class="eyebrow">YOUR MUSIC</p>
            <h2>Library</h2>
          </div>
        </div>
        <div id="libraryList" class="results"></div>
      </section>
    </main>

    <section id="nowPlaying" class="now-playing hidden">
      <img id="playerArt" alt="" src="./icon.svg">
      <div class="player-meta">
        <div id="playerTitle" class="player-title">Nothing playing</div>
        <div id="playerSubtitle" class="player-subtitle"></div>
      </div>
      <button id="prevButton" class="player-button" aria-label="Previous">⏮</button>
      <button id="playButton" class="player-button play" aria-label="Play">▶</button>
      <button id="nextButton" class="player-button" aria-label="Next">⏭</button>
      <button id="expandButton" class="player-button" aria-label="Open player">⌃</button>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <section id="fullPlayer" class="full-player hidden">
      <button id="closePlayer" class="close-button" aria-label="Close">⌄</button>
      <img id="fullArt" alt="">
      <div id="fullTitle" class="full-title"></div>
      <div id="fullSubtitle" class="full-subtitle"></div>
      <input id="progress" class="progress" type="range" min="0" max="100" value="0">
      <div class="time-row"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div class="full-controls">
        <button id="fullPrev" aria-label="Previous">⏮</button>
        <button id="fullPlay" class="big-play" aria-label="Play">▶</button>
        <button id="fullNext" aria-label="Next">⏭</button>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-button active" data-view="homeView">⌂<span>Home</span></button>
      <button class="nav-button" data-view="libraryView">♫<span>Library</span></button>
    </nav>
  </div>
  <script src="./app.js"></script>
</body>
</html>
